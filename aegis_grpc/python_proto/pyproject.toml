[project]
name = "proto_aegis_grpc"
version = "1.0.0"
description = "Package with auto-generated gRPC protobuf messages for the Aegis project."
authors = [
    { name = "AGH Center of Excellence in Artificial Intelligence", email = "ceai@agh.edu.pl" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "grpcio<1.51",
    "grpcio-tools<1.51",
    "protobuf<3.21",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"proto_aegis_grpc" = "proto_aegis_grpc"

[tool.uv]
# Optional: configure uv-specific settings here
