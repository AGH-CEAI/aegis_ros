# This file is based on the following source:
# https://github.com/UniversalRobots/Universal_Robots_ROS2_Driver/blob/humble/ur_robot_driver/config/ur_controllers.yaml
# into a single controller_manager  rather than creating one large ROS parameters file.

# Configuration for the ros2_control
/**:
  controller_manager:
    ros__parameters:
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      io_and_status_controller:
        type: ur_controllers/GPIOController

      speed_scaling_state_broadcaster:
        type: ur_controllers/SpeedScalingStateBroadcaster

      ur_force_torque_sensor_broadcaster:
        type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      scaled_joint_trajectory_controller:
        type: ur_controllers/ScaledJointTrajectoryController

      forward_velocity_controller:
        type: velocity_controllers/JointGroupVelocityController

      forward_position_controller:
        type: position_controllers/JointGroupPositionController

      force_mode_controller:
        type: ur_controllers/ForceModeController

      freedrive_mode_controller:
        type: ur_controllers/FreedriveModeController

      passthrough_trajectory_controller:
        type: ur_controllers/PassthroughTrajectoryController

      tcp_pose_broadcaster:
        type: pose_broadcaster/PoseBroadcaster

      ur_configuration_controller:
        type: ur_controllers/URConfigurationController

      admittance_controller:
        type: admittance_controller/AdmittanceController

  speed_scaling_state_broadcaster:
    ros__parameters:
      state_publish_rate: 100.0
      tf_prefix: "$(var tf_prefix)"

  io_and_status_controller:
    ros__parameters:
      tf_prefix: "$(var tf_prefix)"

  ur_configuration_controller:
    ros__parameters:
      tf_prefix: "$(var tf_prefix)"

  ur_force_torque_sensor_broadcaster:
    ros__parameters:
      sensor_name: $(var tf_prefix)tcp_fts_sensor
      state_interface_names:
        - force.x
        - force.y
        - force.z
        - torque.x
        - torque.y
        - torque.z
      frame_id: $(var tf_prefix)tool0
      topic_name: ft_data

  joint_trajectory_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)elbow_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

  scaled_joint_trajectory_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)elbow_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
      speed_scaling_interface_name: $(var tf_prefix)speed_scaling/speed_scaling_factor

  passthrough_trajectory_controller:
    ros__parameters:
      tf_prefix: "$(var tf_prefix)"
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      state_interfaces:
        - position
        - velocity
      speed_scaling_interface_name: $(var tf_prefix)speed_scaling/speed_scaling_factor

  forward_velocity_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      interface_name: velocity

  forward_position_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint

  force_mode_controller:
    ros__parameters:
      tf_prefix: "$(var tf_prefix)"

  freedrive_mode_controller:
    ros__parameters:
      tf_prefix: "$(var tf_prefix)"

  tcp_pose_broadcaster:
    ros__parameters:
      frame_id: $(var tf_prefix)base
      pose_name: $(var tf_prefix)tcp_pose
      tf:
        child_frame_id: $(var tf_prefix)tool0_controller

  admittance_controller:
    ros__parameters:
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
        - hande_left_finger_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      chainable_command_interfaces:
        - position
        - velocity
      kinematics:
        plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
        plugin_package: kinematics_interface
        base: ur_base  # Assumed to be stationary
        tip: tool_mount_link  # The end effector frame
        alpha: 0.05
      ft_sensor:
        name: ft_sensor
        frame:
          id: fts_link  # Wrench measurements are in this frame
        filter_coefficient: 0.1
      control:
        frame:
          id: fts_link  # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector
      fixed_world_frame:
        frame:            # Gravity points down (neg. Z) in this frame (Usually: world or base_link)
          id: ur_base
      gravity_compensation:
        frame:
          id: fts_link
        CoG:  # specifies the center of gravity of the end effector
          pos:
            - 0.0  # x
            - 0.0  # y
            - 0.0  # z
          force: 15.  # mass * 9.81
      admittance:
        selected_axes:
          - false  # x
          - false  # y
          - true  # z
          - false  # rx
          - false  # ry
          - false  # rz
        # Having ".0" at the end is MUST, otherwise there is a loading error
        # F = M*a + D*v + S*(x - x_d)
        mass:
          - 8.0  # x
          - 8.0  # y
          - 8.0  # z
          - 8.0  # rx
          - 8.0  # ry
          - 8.0  # rz
        damping_ratio:  # damping can be used instead: zeta = D / (2 * sqrt( M * S ))
          - 30.  # x
          - 30.  # y
          - 30.  # z
          - 30.  # rx
          - 30.  # ry
          - 30.  # rz
        stiffness:
          - 60.  # x
          - 60.  # y
          - 60.  # z
          - 60.  # rx
          - 60.  # ry
          - 60.  # rz
      # general settings
      enable_parameter_update_without_reactivation: true
